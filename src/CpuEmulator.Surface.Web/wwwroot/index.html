<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CpuEmulator — Apple ][+</title>
  <!-- Stylized chip/IC favicon: SVG primary, PNG fallback for browsers that ignore SVG icons. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <style>
    /* The one NEW visual value (tokens.md): the drive-activity amber. Everything else reuses the
       shipped Spectrum literals (#111/#ccc/#333/#222/#444/#888). --drive-active is the only addition. */
    :root { --drive-active: #d8a657; }
    body { margin: 0; background: #111; color: #ccc; font-family: system-ui, sans-serif;
           display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
    h1 { font-size: 14px; font-weight: 600; letter-spacing: .04em; margin: 4px 0; }
    /* Nearest-neighbour upscaling so the framebuffer stays crisp; aspect tracks the per-frame size. */
    canvas { image-rendering: pixelated; border: 1px solid #333; background: #000;
             width: min(90vw, 840px); height: auto; aspect-ratio: 280 / 192; }
    #status { font-size: 12px; color: #888; }
    #mode-label { font-size: 12px; color: #888; }
    /* The asset-absent banner reads as a panel: #222 surface, a #444 left rule, calm #ccc text. */
    #asset-banner { font-size: 12px; color: #ccc; background: #222; border-left: 2px solid #444;
                    max-width: 840px; text-align: left; padding: 8px 12px; }
    kbd { background: #222; border: 1px solid #444; border-radius: 3px; padding: 1px 5px; }
    /* --- Control strip (NEW; composed only from the shipped tokens + --drive-active) --- */
    #control-strip { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .drive-panel { border: 1px solid #333; border-radius: 3px; padding: 8px 10px;
                   min-width: 240px; font-size: 12px; color: #ccc; }
    .drive-panel legend, .drive-panel .legend { color: #888; font-size: 12px; padding: 0 4px; }
    .drive-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .drive-light { font-family: system-ui; color: #888; }
    .drive-light.active { color: var(--drive-active); }
    .drive-label { flex: 1; color: #ccc; }
    .drive-eject { margin-left: auto; }
    .drive-controls { display: flex; gap: 8px; align-items: center; }
    .drive-controls select, .drive-controls button { font-size: 12px; }
    /* Drive errors are calm, never red (copy.md §7): legible #ccc on the #111 surface. */
    .drive-error { color: #ccc; margin-top: 4px; min-height: 1em; }
    /* Keep a visible focus ring on every control-strip control (interactions §8): calm #ccc, never removed. */
    .drive-controls select:focus-visible, .drive-controls button:focus-visible,
    .drive-eject:focus-visible, #enable-sound:focus-visible {
      outline: 2px solid #ccc; outline-offset: 1px;
    }
    /* Reduced motion: the upload spinner is a static glyph (interactions §8). */
    @media (prefers-reduced-motion: reduce) { .drive-light.uploading { animation: none; } }

    /* --- Perf-overlay HUD (NEW region; design handoff 2026-06-23-perf-overlay §5). A floating, semi-
       transparent, top-right overlay over the canvas — off by default, backtick toggles it. Built only
       from the shipped tokens plus two new CSS properties (the 0.7-alpha black + backdrop blur). --- */
    /* The canvas gets a positioned wrapper so the HUD can anchor to the DISPLAY corner, not the page. The
       wrapper is sized by the canvas (inline-block shrink-wrap); the HUD is an absolutely-positioned sibling. */
    #screen-wrap { position: relative; display: inline-block; line-height: 0; }
    #perf-hud {
      position: absolute; top: 16px; right: 16px;             /* --pad inset from the display's top-right */
      background: rgba(0, 0, 0, 0.7);                          /* a 70%-opaque form of --canvas-bg #000 */
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      border: 1px solid #444;                                 /* --kbd-border */
      border-radius: 3px;                                     /* --kbd-radius */
      padding: 8px 10px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;  /* system mono, no web font */
      font-size: 12px;                                        /* --muted-size */
      line-height: 1.5;
      color: #ccc;                                            /* --fg (value color) */
      pointer-events: none;                                   /* never intercept canvas pointer/keys */
      user-select: none;
      text-align: left;
      white-space: nowrap;
    }
    #perf-hud[hidden] { display: none; }                       /* off by default = not painted */
    /* Each row: a fixed-width label column (muted) + a value column (fg). */
    #perf-hud .perf-row { display: flex; gap: 10px; }
    #perf-hud .perf-label { color: #888; width: 5ch; }         /* --muted, lowercase, left-aligned */
    #perf-hud .perf-value { color: #ccc; }                     /* --fg */
    #perf-hud .perf-value.accent { color: var(--drive-active); } /* amber: active tier word + throughput headline */
    #perf-hud .perf-disconnected { color: #888; margin-top: 2px; }  /* the frozen "· disconnected" line */
  </style>
</head>
<body>
  <h1>CpuEmulator — Apple ][+</h1>
  <!-- The canvas + its perf-HUD overlay share a positioned wrapper so the HUD anchors to the DISPLAY's
       top-right corner (clear of the boot text / CP/M A> prompt at the top-left), not the page. -->
  <div id="screen-wrap">
    <canvas id="screen" width="280" height="192"></canvas>
    <!-- The perf-overlay HUD (design handoff 2026-06-23-perf-overlay). Off by default (hidden); the backtick
         ` key toggles it. app.js (repaintHud) fills the value cells from window.perfStats (PF frame) + the
         client-measured FPS; the jit/cpu2 rows are shown only when they apply. Pure output — no controls. -->
    <div id="perf-hud" role="group" aria-label="performance overlay" hidden>
      <div class="perf-row"><span class="perf-label">board</span><span class="perf-value" id="perf-board">—</span></div>
      <div class="perf-row"><span class="perf-label">fps</span><span class="perf-value" id="perf-fps">—</span></div>
      <div class="perf-row"><span class="perf-label">guest</span><span class="perf-value accent" id="perf-guest">—</span></div>
      <div class="perf-row"><span class="perf-label">mem</span><span class="perf-value" id="perf-mem">—</span></div>
      <div class="perf-row"><span class="perf-label">tier</span><span class="perf-value" id="perf-tier">—</span></div>
      <div class="perf-row" id="perf-jit-row" hidden><span class="perf-label">jit</span><span class="perf-value" id="perf-jit">—</span></div>
      <div class="perf-row" id="perf-cpu2-row" hidden><span class="perf-label">cpu2</span><span class="perf-value" id="perf-cpu2">—</span></div>
      <div class="perf-disconnected" id="perf-disconnected" hidden>· disconnected</div>
    </div>
  </div>
  <div id="mode-label"></div>
  <div id="status" aria-live="polite">connecting…</div>
  <div id="asset-banner" hidden></div>
  <button id="enable-sound" type="button">click to enable sound</button>
  <div id="hint">Uppercase only. <kbd>Ctrl+B</kbd> = BASIC. <kbd>Ctrl+Backspace</kbd> = RESET. <kbd>`</kbd> = perf HUD</div>

  <!-- The control strip (PR-T). app.js (renderControlStrip) fills each panel's top line (light +
       label + eject) and controls line (library select + Insert… + the hidden file input) from the
       host-pushed ST snapshot + the disk catalog. The containers are scaffold only — no fabricated
       indicator lives in the markup. -->
  <div id="control-strip">
    <fieldset class="drive-panel" id="drive-1">
      <legend>Drive 1</legend>
      <div class="drive-top">
        <span class="drive-light" id="drive-1-light" aria-label="drive 1 empty">○</span>
        <span class="drive-label" id="drive-1-label">empty</span>
        <button class="drive-eject" id="drive-1-eject" type="button" hidden>Eject</button>
      </div>
      <div class="drive-controls">
        <select id="drive-1-library" aria-label="Drive 1 library"></select>
        <button id="drive-1-insert" type="button">Insert…</button>
        <input id="drive-1-file" type="file" accept=".woz,.dsk,.po" hidden />
      </div>
      <div class="drive-error" id="drive-1-error" role="status" aria-live="polite"></div>
    </fieldset>
    <fieldset class="drive-panel" id="drive-2">
      <legend>Drive 2</legend>
      <div class="drive-top">
        <span class="drive-light" id="drive-2-light" aria-label="drive 2 empty">○</span>
        <span class="drive-label" id="drive-2-label">empty</span>
        <button class="drive-eject" id="drive-2-eject" type="button" hidden>Eject</button>
      </div>
      <div class="drive-controls">
        <select id="drive-2-library" aria-label="Drive 2 library"></select>
        <button id="drive-2-insert" type="button">Insert…</button>
        <input id="drive-2-file" type="file" accept=".woz,.dsk,.po" hidden />
      </div>
      <div class="drive-error" id="drive-2-error" role="status" aria-live="polite"></div>
    </fieldset>
  </div>

  <script src="app.js"></script>
</body>
</html>
